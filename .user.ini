[PHP]
error_log = "error_log"
log_errors = Off
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
display_errors = On
max_execution_time = 30
max_input_time = 60
max_input_vars = 1000
session.gc_maxlifetime = 1440
session.save_path = "/opt/alt/php83/var/lib/php/session"
zlib.output_compression = Off
