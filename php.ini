; cPanel-generated php ini directives, do not edit
; Manual editing of this file may result in unexpected behavior.
; To make changes to this file, use the cPanel MultiPHP INI Editor (Home >> Software >> MultiPHP INI Editor)
; For more information, read our documentation (https://go.cpanel.net/EA4ModifyINI)

; Local development upload limits for `composer run dev`
; Used by the artisan parent process (`php -c php.ini artisan serve`).
; The built-in server child gets the same limits via -d flags in App\Console\Commands\ServeCommand.
upload_max_filesize = 50M
post_max_size = 55M
max_file_uploads = 20
memory_limit = 256M
allow_url_fopen = On
display_errors = On
enable_dl = Off
error_log = "error_log"
file_uploads = On
log_errors = Off
max_execution_time = 30
max_input_time = 60
max_input_vars = 1000
session.gc_maxlifetime = 1440
session.save_path = "/opt/alt/php83/var/lib/php/session"
zlib.output_compression = Off
